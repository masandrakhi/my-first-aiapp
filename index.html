<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="A simple, motivating daily habit tracker." />
    <title>Habits</title>
    <script>
      // Saved data lives per address, and "localhost" and "127.0.0.1" count as different sites.
      // Always use one so habits never seem to vanish when the other address is opened.
      // Habits saved under the old address ride along in the URL fragment (never sent to the
      // server) and are merged in on arrival, once; the original copy is kept here as a backup.
      if (location.hostname === 'localhost' || location.hostname === '[::1]') {
        var target = new URL(location.href)
        target.hostname = '127.0.0.1'
        try {
          var key = 'habit-tracker:v1'
          var raw = localStorage.getItem(key)
          var parsed = raw && JSON.parse(raw)
          if (parsed && parsed.habits && parsed.habits.length && !localStorage.getItem(key + ':migrated')) {
            target.hash = 'import=' + encodeURIComponent(raw)
            localStorage.setItem(key + ':migrated', new Date().toISOString())
          }
        } catch (e) {}
        location.replace(target.href)
      }
    </script>
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash while loading.
      try {
        var t = (JSON.parse(localStorage.getItem('habit-tracker:v1') || '{}').settings || {}).theme
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
    <style>
      /* Splash shown until React mounts (replaced by the app). */
      .splash { min-height: 100dvh; display: grid; place-items: center; background: #faf7f2; font-family: system-ui, sans-serif; }
      .dark .splash { background: #0f0d0b; }
      .splash-mark { display: grid; justify-items: center; gap: 12px; color: #57534e; font-weight: 700; letter-spacing: -0.01em; }
      .dark .splash-mark { color: #d6d3d1; }
      .splash-logo { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px;
        background: linear-gradient(135deg, #9333ea, #c026d3); animation: splash-pulse 1.2s ease-in-out infinite; }
      @keyframes splash-pulse { 50% { transform: scale(0.92); opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading Habits">
        <div class="splash-mark"><div class="splash-logo" aria-hidden="true">🔥</div>Habits</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
